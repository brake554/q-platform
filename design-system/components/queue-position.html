<!-- @dsCard group="Queue" name="Queue Position" subtitle="Gradient numeral, live pulse, glass info rows" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q — Queue Position</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:28px;background:#08080c;font-family:'Space Grotesk',system-ui,sans-serif;color:#f4f4f8;display:flex;flex-direction:column;align-items:center}
.venue{font-size:16px;color:#6b6b80;margin-bottom:10px;font-weight:500}
.overline{font-size:12px;color:#50505f;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px;text-align:center;font-weight:600}
.pos{font-size:104px;font-weight:700;line-height:1;text-align:center;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#8b5cf6,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 32px rgba(139,92,246,.4))}
.sub{font-size:14px;color:#6b6b80;margin-top:10px;text-align:center}
.live{display:flex;gap:8px;align-items:center;margin:32px 0}
.pulse{width:8px;height:8px;border-radius:50%;background:#2dd48f;box-shadow:0 0 12px rgba(45,212,143,.8);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.4);opacity:1}}
.live span{font-size:13px;color:#6b6b80}
.info{width:100%;max-width:340px}
.info-card{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#13131b,#101016);border:1px solid #1e1e2a;border-radius:16px;padding:14px 18px;margin-bottom:10px}
.info-icon{width:20px;height:20px;stroke:#a78bfa;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.info-label{font-size:12px;color:#6b6b80}
.info-value{font-size:14px;color:#f4f4f8;font-weight:600}
.link{color:#a78bfa;cursor:pointer}
</style>
</head>
<body>
<div class="venue">Marquee Club</div>
<div class="overline">Your position</div>
<div class="pos">#13</div>
<div class="sub">12 ahead of you</div>
<div class="live"><div class="pulse"></div><span>Queue updating in real time</span></div>
<div class="info">
<div class="info-card"><svg class="info-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><div><div class="info-label">Admission timer</div><div class="info-value">90s</div></div></div>
<div class="info-card"><svg class="info-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><div><div class="info-label">We'll notify you</div><div class="info-value">Stay anywhere nearby</div></div></div>
<div class="info-card"><svg class="info-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><div><div class="info-label">Pre-book instead</div><div class="info-value link">Reserve a time →</div></div></div>
</div>
</body>
</html>
