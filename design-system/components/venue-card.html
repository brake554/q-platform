<!-- @dsCard group="Cards" name="Venue Card" subtitle="Glass card, tinted icon well, live occupancy" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q — Venue Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:28px;background:#08080c;font-family:'Space Grotesk',system-ui,sans-serif;color:#f4f4f8}
.card{max-width:400px;background:linear-gradient(180deg,#13131b,#101016);border:1px solid #1e1e2a;border-radius:20px;padding:18px;cursor:pointer;margin-bottom:14px;user-select:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:#3a3a52}
.card:active{transform:scale(0.97)}
.top{display:flex;align-items:flex-start;gap:14px}
.icon{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,rgba(139,92,246,0.18),rgba(217,70,239,0.10));border:1px solid rgba(139,92,246,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:22px;height:22px;stroke:#a78bfa;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-size:16px;font-weight:600;color:#f4f4f8;margin-bottom:2px;letter-spacing:-0.01em}
.addr{font-size:12px;color:#6b6b80;margin-bottom:4px}
.inq{font-size:12px;color:#9a9aad}
.inq b{color:#a78bfa;font-weight:600}
.price{font-size:13px;color:#a78bfa;font-weight:700}
.tag{font-size:11px;font-weight:700;letter-spacing:0.5px;border-radius:999px;padding:4px 10px}
.free{color:#2dd48f;background:rgba(45,212,143,0.12);border:1px solid rgba(45,212,143,0.25)}
.full{color:#ff4d6d;background:rgba(255,77,109,0.12);border:1px solid rgba(255,77,109,0.25)}
.occ{margin-top:12px}
.occ-head{display:flex;justify-content:space-between;font-size:11px;color:#9a9aad;margin-bottom:6px}
.occ-head b{font-weight:600}
.track{height:5px;border-radius:3px;background:#1e1e2a;overflow:hidden}
.fill{height:100%;border-radius:3px}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div class="icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
<div class="body">
<div class="head"><div class="name">Marquee Club</div><span class="price">$20</span></div>
<div class="addr">132 Queen St W</div>
<div class="inq"><b>12</b> in Q</div>
</div>
</div>
<div class="occ">
<div class="occ-head"><span>Occupancy</span><b style="color:#f5a524">80%</b></div>
<div class="track"><div class="fill" style="width:80%;background:linear-gradient(90deg,#f5a52488,#f5a524);box-shadow:0 0 8px rgba(245,165,36,.5)"></div></div>
</div>
</div>
<div class="card">
<div class="top">
<div class="icon"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg></div>
<div class="body">
<div class="head"><div class="name">Studio Glow Salon</div><span class="tag free">FREE</span></div>
<div class="addr">210 King St E</div>
<div class="inq"><b>2</b> in Q</div>
</div>
</div>
<div class="occ">
<div class="occ-head"><span>Occupancy</span><b style="color:#2dd48f">33%</b></div>
<div class="track"><div class="fill" style="width:33%;background:linear-gradient(90deg,#2dd48f88,#2dd48f);box-shadow:0 0 8px rgba(45,212,143,.5)"></div></div>
</div>
</div>
<div class="card">
<div class="top">
<div class="icon"><svg viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></div>
<div class="body">
<div class="head"><div class="name">Ink Society Tattoo</div><span class="tag full">FULL</span></div>
<div class="addr">44 Ossington Ave</div>
<div class="inq"><b>8</b> in Q</div>
</div>
</div>
<div class="occ">
<div class="occ-head"><span>Occupancy</span><b style="color:#ff4d6d">100%</b></div>
<div class="track"><div class="fill" style="width:100%;background:linear-gradient(90deg,#ff4d6d88,#ff4d6d);box-shadow:0 0 8px rgba(255,77,109,.5)"></div></div>
</div>
</div>
</body>
</html>
