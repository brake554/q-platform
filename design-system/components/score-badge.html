<!-- @dsCard group="Score" name="Score Badge" subtitle="Gradient rings, glow tiers" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q — Score Badge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:28px;background:#08080c;font-family:'Space Grotesk',system-ui,sans-serif;color:#f4f4f8}
h2{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#50505f;margin:28px 0 14px;font-weight:600}
.row{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.badge{position:relative}
.inner{position:absolute;border-radius:50%;background:#0d0d13;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score{font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.label{font-size:11px;color:#6b6b80;margin-top:4px}
.flag{border-radius:50%;background:rgba(255,77,109,0.08);border:8px solid #ff4d6d;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(255,77,109,0.4);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.flag-label{font-size:11px;color:#ff4d6d;font-weight:700;margin-top:2px;letter-spacing:1px}
svg{transform:rotate(-90deg);position:absolute;top:0;left:0}
</style>
</head>
<body>
<h2>Tiers — 80+ good · 50–79 watch · &lt;50 low · red flag (3+ bans)</h2>
<div class="row">
<div class="badge" style="width:140px;height:140px;filter:drop-shadow(0 0 16px rgba(45,212,143,.35))">
<svg width="140" height="140">
<circle cx="70" cy="70" r="66" fill="none" stroke="#1e1e2a" stroke-width="8"></circle>
<circle cx="70" cy="70" r="66" fill="none" stroke="#2dd48f" stroke-width="8" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="53.9"></circle>
</svg>
<div class="inner" style="top:12px;left:12px;width:120px;height:120px">
<div class="score" style="font-size:40px;color:#2dd48f">87</div>
<div class="label">Good Standing</div>
</div>
</div>
<div class="badge" style="width:140px;height:140px;filter:drop-shadow(0 0 16px rgba(245,165,36,.35))">
<svg width="140" height="140">
<circle cx="70" cy="70" r="66" fill="none" stroke="#1e1e2a" stroke-width="8"></circle>
<circle cx="70" cy="70" r="66" fill="none" stroke="#f5a524" stroke-width="8" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="165.9"></circle>
</svg>
<div class="inner" style="top:12px;left:12px;width:120px;height:120px">
<div class="score" style="font-size:40px;color:#f5a524">60</div>
<div class="label">Watch List</div>
</div>
</div>
<div class="badge" style="width:140px;height:140px;filter:drop-shadow(0 0 16px rgba(255,77,109,.35))">
<svg width="140" height="140">
<circle cx="70" cy="70" r="66" fill="none" stroke="#1e1e2a" stroke-width="8"></circle>
<circle cx="70" cy="70" r="66" fill="none" stroke="#ff4d6d" stroke-width="8" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="290.3"></circle>
</svg>
<div class="inner" style="top:12px;left:12px;width:120px;height:120px">
<div class="score" style="font-size:40px;color:#ff4d6d">30</div>
<div class="label">Low Score</div>
</div>
</div>
<div class="flag" style="width:124px;height:124px">
<svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:#ff4d6d;stroke-width:2;fill:none;stroke-linecap:round"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
<div class="flag-label">RED FLAG</div>
</div>
</div>
<h2>Small — 48px, queue rows</h2>
<div class="row">
<div class="badge" style="width:48px;height:48px">
<svg width="48" height="48">
<circle cx="24" cy="24" r="22" fill="none" stroke="#1e1e2a" stroke-width="4"></circle>
<circle cx="24" cy="24" r="22" fill="none" stroke="#2dd48f" stroke-width="4" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="18"></circle>
</svg>
<div class="inner" style="top:8px;left:8px;width:32px;height:32px">
<div class="score" style="font-size:14px;color:#2dd48f">87</div>
</div>
</div>
</div>
</body>
</html>
