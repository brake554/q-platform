<!-- @dsCard group="Score" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q — Score Badge</title>
<style>
  body { margin: 0; padding: 24px; background: #0a0a0a; font-family: -apple-system, system-ui, sans-serif; color: #f5f5f5; }
  h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #555; margin: 24px 0 12px; }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .badge { position: relative; }
  .inner {
    position: absolute; border-radius: 50%; background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score { font-weight: 900; line-height: 1; }
  .label { font-size: 11px; color: #666; margin-top: 2px; }
  .flag {
    border-radius: 50%; background: #1a0000; border: 8px solid #ef4444;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(239,68,68,0.4);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .flag-label { font-size: 11px; color: #ef4444; font-weight: 700; margin-top: 2px; }
  svg { transform: rotate(-90deg); position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
  <h2>Tiers — 80+ good · 50–79 watch · &lt;50 low · red flag (3+ bans)</h2>
  <div class="row">
    <!-- lg 140, ring 8, r=66, C=414.7 -->
    <div class="badge" style="width:140px;height:140px">
      <svg width="140" height="140">
        <circle cx="70" cy="70" r="66" fill="none" stroke="#2a2a2a" stroke-width="8"/>
        <circle cx="70" cy="70" r="66" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="414.7" stroke-dashoffset="53.9"/>
      </svg>
      <div class="inner" style="top:12px;left:12px;width:120px;height:120px">
        <div class="score" style="font-size:38px;color:#10b981">87</div>
        <div class="label">Good Standing</div>
      </div>
    </div>
    <div class="badge" style="width:140px;height:140px">
      <svg width="140" height="140">
        <circle cx="70" cy="70" r="66" fill="none" stroke="#2a2a2a" stroke-width="8"/>
        <circle cx="70" cy="70" r="66" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="414.7" stroke-dashoffset="165.9"/>
      </svg>
      <div class="inner" style="top:12px;left:12px;width:120px;height:120px">
        <div class="score" style="font-size:38px;color:#f59e0b">60</div>
        <div class="label">Watch List</div>
      </div>
    </div>
    <div class="badge" style="width:140px;height:140px">
      <svg width="140" height="140">
        <circle cx="70" cy="70" r="66" fill="none" stroke="#2a2a2a" stroke-width="8"/>
        <circle cx="70" cy="70" r="66" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="414.7" stroke-dashoffset="290.3"/>
      </svg>
      <div class="inner" style="top:12px;left:12px;width:120px;height:120px">
        <div class="score" style="font-size:38px;color:#ef4444">30</div>
        <div class="label">Low Score</div>
      </div>
    </div>
    <div class="flag" style="width:124px;height:124px">
      <span style="font-size:42px">💀</span>
      <div class="flag-label">RED FLAG</div>
    </div>
  </div>
  <h2>Small — 48px, queue rows</h2>
  <div class="row">
    <div class="badge" style="width:48px;height:48px">
      <svg width="48" height="48">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#2a2a2a" stroke-width="4"/>
        <circle cx="24" cy="24" r="22" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="138.2" stroke-dashoffset="18"/>
      </svg>
      <div class="inner" style="top:8px;left:8px;width:32px;height:32px">
        <div class="score" style="font-size:14px;color:#10b981">87</div>
      </div>
    </div>
  </div>
</body>
</html>
